/* ---------- 12. Биржа ---------- */
function buyStock(sym, qty){
  if(!STOCK_PRICES) initStockPrices();
  const price = STOCK_PRICES[sym];
  const total = Math.round(price * qty);
  if(S.money < total){
    push('❌','Мало денег', `Нужно ${fmtMoney(total)}`);
    return;
  }
  const s = S.empire.stocks[sym] || { shares:0, avg:0 };
  const newShares = s.shares + qty;
  const newAvg = (s.avg * s.shares + price * qty) / newShares;
  S.empire.stocks[sym] = { shares: newShares, avg: Math.round(newAvg*100)/100 };
  S.money -= total;
  push('📈','Куплено акций', qty + '× ' + sym + ' по ' + fmt(price) + ' ₽');
  beep(760,0.1,'sine',0.05);
  save();
  renderEmpire();
}

function sellStock(sym, qty){
  if(!STOCK_PRICES) initStockPrices();
  const s = S.empire.stocks[sym];
  if(!s || s.shares < qty){
    push('❌','Нет акций', 'У вас недостаточно акций');
    return;
  }
  const price = STOCK_PRICES[sym];
  const total = Math.round(price * qty);
  S.money += total;
  S.stats.earned += total;
  s.shares -= qty;
  if(s.shares <= 0) delete S.empire.stocks[sym];
  const profit = Math.round((price - s.avg) * qty);
  push('📉','Продано акций', qty + '× ' + sym + ' → ' + fmtMoney(total) + (profit>=0?' (+'+fmt(profit)+')':' ('+fmt(profit)+')'));
  beep(660,0.1,'sine',0.05);
  save();
  renderEmpire();
}

/* ---------- 13. Приложение "Империя" ---------- */
let empireTab = 'props';
function renderEmpire(body){
  const b = body || $('appBody');
  b.innerHTML = '';

  if(!STOCK_PRICES) initStockPrices();

  // ---- Шапка с VIP-статусом и доходом ----
  const vip = vipTier();
  const inc = calculateEmpireIncome();
  const head = el('div','card');
  head.style.background = 'linear-gradient(135deg,rgba(212,160,23,.18),rgba(212,160,23,.05))';
  head.style.borderColor = 'rgba(212,160,23,.5)';
  head.innerHTML = `
    <div class="row">
      <div style="display:flex;gap:10px;align-items:center">
        <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(140deg,#d4a017,#a87517);display:grid;place-items:center;font-size:24px">${vip.emoji}</div>
        <div>
          <div style="font-size:14px;font-weight:750">${vip.name}</div>
          <div class="tiny">${vip.desc}</div>
        </div>
      </div>
      <div style="text-align:right">
        <div class="muted">Доход империи</div>
        <div class="mid green" id="empireIncome">+${fmt(inc)}/мин</div>
      </div>
    </div>
  `;
  b.appendChild(head);

  // ---- Табы ----
  const tabs = el('div','chips');
  [['props','🏢 Недвижимость'],['holdings','🏛 Холдинги'],['luxury','💎 Роскошь'],['mega','🏗 Мегапроекты'],['stocks','📈 Биржа']].forEach(([k,label])=>{
    const c = el('div','chip'+(empireTab===k?' on':''), label);
    c.onclick = ()=>{ empireTab = k; renderEmpire(); };
    tabs.appendChild(c);
  });
  b.appendChild(tabs);

  // ---- Содержимое ----
  if(empireTab === 'props')      renderEmpireProps(b);
  else if(empireTab === 'holdings') renderEmpireHoldings(b);
  else if(empireTab === 'luxury')   renderEmpireLuxury(b);
  else if(empireTab === 'mega')     renderEmpireMega(b);
  else if(empireTab === 'stocks')   renderEmpireStocks(b);
}

function renderEmpireProps(b){
  const totalOwned = Object.values(S.empire.properties).reduce((a,n)=>a+n,0);
  const info = el('div','card tight');
  info.innerHTML = `<div class="muted">Всего объектов: <b>${totalOwned}</b> · Доход от недвижимости: <b class="green">+${fmt(calculateEmpireIncome())}/мин</b></div>`;
  b.appendChild(info);

  PROPERTIES.forEach(p => {
    const owned = S.empire.properties[p.id] || 0;
    const price = Math.round(p.price * Math.pow(1.15, owned));
    const maxed = owned >= p.max;
    const row = el('div','item');
    row.innerHTML = `
      <div class="ico" style="background:rgba(212,160,23,.18)">${p.emoji}</div>
      <div class="txt">
        <div class="n">${p.name} <span class="pill b">${owned}/${p.max}</span></div>
        <div class="s">${p.desc} · <b class="green">+${fmt(p.income)}/мин</b> за шт</div>
      </div>
      <div class="val">
        ${maxed
          ? '<span class="tiny green">MAX</span>'
          : `<button class="btn xs yellow" data-prop="${p.id}" ${S.money<price?'disabled':''}>${fmt(price)} ₽</button>`}
      </div>
    `;
    b.appendChild(row);
  });

  b.querySelectorAll('[data-prop]').forEach(btn => {
    btn.onclick = () => buyProperty(btn.getAttribute('data-prop'));
  });
}

function renderEmpireHoldings(b){
  const info = el('div','card tight');
  info.innerHTML = `<div class="muted">Поглощено компаний: <b>${S.empire.holdings.length}</b>. Каждая приносит <b>0.001%</b> капитала в минуту. Цена выкупа = 1.5× капитал компании.</div>`;

  // Топ-15 лидерборда

      <div class="txt">
        <div class="n">${esc(c.name)} ${owned?'<span class="pill y">🏛 в холдинге</span>':''}</div>

      </div>
      <div class="val">
        ${owned
          ? '<span class="tiny green">✔</span>'
          : `<button class="btn xs" data-hold="${esc(c.name)}" ${S.money<price?'disabled':''}>${fmt(price)} ₽</button>`}
      </div>
    `;

function renderEmpireLuxury(b){
  const owned = S.empire.luxury;
  const totalRep = LUXURY.filter(l => owned.includes(l.id)).reduce((a,l)=>a+l.rep, 0);
  const info = el('div','card tight');
  info.innerHTML = `<div class="muted">Предметов роскоши: <b>${owned.length}/${LUXURY.length}</b> · Бонус к репутации: <b class="yellow">+${totalRep}</b></div>`;

      <div class="ico" style="background:rgba(212,160,23,.18);font-size:24px">${l.emoji}</div>

      <div class="val">
        ${has
          ? '<span class="tiny green">✔</span>'

      </div>

}

function renderEmpireMega(b){
  const info = el('div','card tight');
  let mult = 1;
  S.empire.mega.forEach(id => { const m = MEGA.find(x=>x.id===id); if(m) mult *= m.flow; });
  info.innerHTML = `<div class="muted">Построено: <b>${S.empire.mega.length}/${MEGA.length}</b> · Суммарный буст потока: <b class="green">×${mult.toFixed(2)}</b></div>`;

  MEGA.forEach(m => {
    const has = S.empire.mega.includes(m.id);
    const row = el('div','item');
    if(has) row.style.background = 'rgba(212,160,23,.10)';
    row.style.flexWrap = 'wrap';
    row.innerHTML = `
      <div class="ico" style="background:rgba(212,160,23,.18);font-size:26px">${m.emoji}</div>
      <div class="txt">
        <div class="n">${m.name} ${has?'<span class="pill y">✔ Построено</span>':''}</div>
        <div class="s">${m.desc}</div>
      </div>
      <div class="val" style="width:100%;margin-top:8px">
        ${has
          ? '<span class="tiny green" style="display:block;text-align:right">Работает</span>'
          : `<button class="btn sm full yellow" data-mega="${m.id}" ${S.money<m.price?'disabled':''}>Построить за ${fmt(m.price)} ₽</button>`}
      </div>
    `;
    b.appendChild(row);
  });

  b.querySelectorAll('[data-mega]').forEach(btn => {
    btn.onclick = () => buyMega(btn.getAttribute('data-mega'));
  });
}

function renderEmpireStocks(b){
  if(!STOCK_PRICES) initStockPrices();

  // Сводка портфеля
  let portValue = 0, portCost = 0;
  for(const sym in S.empire.stocks){
    const s = S.empire.stocks[sym];
    portValue += s.shares * (STOCK_PRICES[sym] || 0);
    portCost += s.shares * s.avg;
  }
  const pnl = portValue - portCost;
  const info = el('div','card tight');
  info.innerHTML = `
    <div class="row">
      <div><div class="muted">Портфель</div><div class="mid">${fmtMoney(portValue)}</div></div>
      <div style="text-align:right">
        <div class="muted">Прибыль</div>
        <div class="mid ${pnl>=0?'green':'red'}">${pnl>=0?'+':''}${fmtMoney(pnl)}</div>
      </div>
    </div>
  `;
  b.appendChild(info);

  // Список акций
  STOCKS.forEach(st => {
    const price = STOCK_PRICES[st.sym];
    const my = S.empire.stocks[st.sym] || { shares:0, avg:0 };
    const diff = ((price / st.base - 1) * 100);
    const diffColor = diff >= 0 ? 'var(--green)' : 'var(--red)';
    const myPnl = my.shares > 0 ? (price - my.avg) * my.shares : 0;

    const card = el('div','card tight');
    card.innerHTML = `
      <div class="row" style="margin-bottom:8px">
        <div>
          <div style="font-size:14px;font-weight:750">${st.sym} · <span class="muted" style="font-weight:500;font-size:12px">${st.name}</span></div>
          <div class="tiny" style="margin-top:2px">База: ${fmt(st.base)} ₽ · Волатильность: ${(st.vol*100).toFixed(1)}%</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:16px;font-weight:800;color:${diffColor}">${fmt(price)} ₽</div>
          <div class="tiny" style="color:${diffColor}">${diff>=0?'+':''}${diff.toFixed(2)}%</div>
        </div>
      </div>
      ${my.shares > 0 ? `
        <div class="row" style="background:var(--surface2);border-radius:10px;padding:6px 10px;margin-bottom:8px">
          <span class="tiny">У вас: <b>${my.shares} шт</b> · ср. цена ${fmt(my.avg)} ₽</span>
          <span class="tiny ${myPnl>=0?'green':'red'}"><b>${myPnl>=0?'+':''}${fmt(myPnl)} ₽</b></span>
        </div>
      ` : ''}
      <div class="btn-row">
        <button class="btn xs" data-buy-stock="${st.sym}" data-qty="1" ${S.money<price?'disabled':''}>Купить 1</button>
        <button class="btn xs ghost" data-buy-stock="${st.sym}" data-qty="10" ${S.money<price*10?'disabled':''}>×10</button>
        <button class="btn xs ghost" data-buy-stock="${st.sym}" data-qty="100" ${S.money<price*100?'disabled':''}>×100</button>
        ${my.shares > 0 ? `
          <button class="btn xs red" data-sell-stock="${st.sym}" data-qty="1">Продать 1</button>
          <button class="btn xs red" data-sell-stock="${st.sym}" data-qty="${my.shares}">Всё (${my.shares})</button>
        ` : ''}
      </div>
    `;
    b.appendChild(card);
  });

  b.querySelectorAll('[data-buy-stock]').forEach(btn => {
    btn.onclick = () => buyStock(btn.getAttribute('data-buy-stock'), parseInt(btn.getAttribute('data-qty')));
  });
  b.querySelectorAll('[data-sell-stock]').forEach(btn => {
    btn.onclick = () => sellStock(btn.getAttribute('data-sell-stock'), parseInt(btn.getAttribute('data-qty')));
  });
}

renderApp = function(id){

    const b = $('appBody');
    b.innerHTML = '';
    renderEmpire(b);
    return;
  }

/* ---------- 15. Хук init: инициализация акций (ИСПРАВЛЕНО) ---------- */
const _origInit7 = init;
init = function(){
  // ВАЖНО: сначала вызываем оригинальный init — он загрузит или создаст S
  _origInit7();

  // Теперь S гарантированно существует — дополняем empire для старых сейвов
  if(!S.empire){
    S.empire = { properties:{}, holdings:[], luxury:[], mega:[], stocks:{}, vip:0 };
  }
  if(!S.empire.properties) S.empire.properties = {};
  if(!S.empire.holdings) S.empire.holdings = [];
  if(!S.empire.luxury) S.empire.luxury = [];
  if(!S.empire.mega) S.empire.mega = [];
  if(!S.empire.stocks) S.empire.stocks = {};
  if(typeof S.empire.vip !== 'number') S.empire.vip = 0;

  // Инициализация биржи после загрузки S
  initStockPrices();
  updateVip();

  // Приветственный пуш для миллиардеров
  setTimeout(() => {
    if(S.money >= 1_000_000_000 && S.empire.mega.length === 0){
      push('💰','Империя ждёт!','У вас миллиард — пора строить мегапроекты');
    }
  }, 5000);
};

// Исправление: защита от повторного отображения одинаковых карточек/кнопок в приложениях.
const __renderAppBeforeDedupe = renderApp;
renderApp = function(id){
  __renderAppBeforeDedupe(id);
  const body = document.getElementById('appBody');
  if(!body) return;
  // Удаляем только полностью одинаковые соседние карточки и кнопки, не затрагивая разные элементы.
  const seenCards = new Set();
  Array.from(body.querySelectorAll('.card')).forEach(node => {
    const key = node.innerText.replace(/\s+/g,' ').trim();
    if(seenCards.has(key)) node.remove(); else seenCards.add(key);
  });
  const seenButtons = new Set();
  Array.from(body.querySelectorAll('button')).forEach(node => {
    const key = node.innerText.replace(/\s+/g,' ').trim();
    if(key && seenButtons.has(key)) node.remove(); else if(key) seenButtons.add(key);
  });
};

// старт
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
