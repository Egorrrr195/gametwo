<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Симулятор Магазина 24/7</title>
<style>
/* ========== БАЗА ========== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(circle at 25% 15%,#2b3346 0%,#12151c 55%,#07090d 100%);
  display:flex;align-items:center;justify-content:center;
  color:#fff;user-select:none;
}

/* ========== КОРПУС ТЕЛЕФОНА ========== */
/* Мобильный по умолчанию: на весь экран */
.phone{
  position:relative;width:100vw;height:100dvh;
  background:linear-gradient(145deg,#2c2c30,#131316);
  flex-shrink:0;
}
.side-btn{display:none}
.island{display:none}

.screen{
  position:relative;width:100%;height:100%;
  overflow:hidden;background:var(--bg);
  display:flex;flex-direction:column;
  transition:background .35s;
}

/* Большие экраны: реалистичный корпус */
@media (min-width:700px) and (min-height:900px){
  body{padding:20px}
  .phone{
    width:390px;height:844px;border-radius:56px;padding:11px;
    box-shadow:
      0 0 0 2px #3d3d42, 0 0 0 9px #0f0f12, 0 0 0 10px #2a2a2e,
      0 40px 90px rgba(0,0,0,.75), inset 0 0 20px rgba(0,0,0,.6);
  }
  .screen{border-radius:46px}
  .app-win{border-radius:46px}
  .island{
    display:block;
    position:absolute;top:22px;left:50%;transform:translateX(-50%);
    width:118px;height:33px;background:#000;border-radius:20px;z-index:60;
    box-shadow:inset 0 0 4px rgba(255,255,255,.08);
  }
  .island::after{
    content:'';position:absolute;right:11px;top:50%;transform:translateY(-50%);
    width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#1c2a3a,#050608 70%);
    box-shadow:inset 0 0 2px #0af3,0 0 0 1px #111;
  }
  .side-btn{display:block;position:absolute;background:linear-gradient(90deg,#3a3a40,#1e1e22);border-radius:3px}
  .side-btn.pw{right:-3px;top:190px;width:4px;height:86px}
  .side-btn.vu{left:-3px;top:150px;width:4px;height:60px}
  .side-btn.vd{left:-3px;top:224px;width:4px;height:60px}
  .side-btn.sl{left:-3px;top:300px;width:4px;height:44px}
}

/* Очень большие экраны: увеличиваем телефон */
@media (min-width:1100px) and (min-height:1050px){
  .phone{width:430px;height:930px}
}
@media (min-width:1500px) and (min-height:1200px){
  .phone{width:460px;height:996px}
}

/* ========== ТЕМЫ ========== */
:root{
  --bg:#eef1f6;
  --surface:#fff;
  --surface2:#f5f7fb;
  --surface3:#e8ecf4;
  --text:#11131a;
  --text2:#5b6473;
  --text3:#98a1b2;
  --border:#dde3ee;
  --accent:#3b6ef5;
  --accent2:#2c55c9;
  --green:#17a34a;
  --red:#e0342b;
  --yellow:#d89614;
  --purple:#7c4ddb;
  --pink:#e0459b;
  --shadow:0 2px 10px rgba(20,30,60,.09);
  --shadow-lg:0 10px 34px rgba(20,30,60,.16);
  --wall:linear-gradient(160deg,#c9d8f5 0%,#dfe6f7 40%,#eae3f5 100%);
  --dock:rgba(255,255,255,.55);
  --head:rgba(255,255,255,.35);
  --input:#f0f3f9;
  --scroll:rgba(0,0,0,.18);
}
[data-theme="dark"]{
  --bg:#0d0f15;
  --surface:#181c25;
  --surface2:#1f242f;
  --surface3:#262c39;
  --text:#eef1f7;
  --text2:#9aa4b7;
  --text3:#69738a;
  --border:#2a3140;
  --accent:#5b86f7;
  --accent2:#4069d8;
  --green:#22c55e;
  --red:#f0554a;
  --yellow:#eab308;
  --purple:#9d6ef0;
  --pink:#f055a8;
  --shadow:0 2px 10px rgba(0,0,0,.4);
  --shadow-lg:0 12px 38px rgba(0,0,0,.6);
  --wall:linear-gradient(160deg,#141a2b 0%,#1c1730 45%,#0f1420 100%);
  --dock:rgba(40,46,60,.5);
  --head:rgba(20,25,35,.4);
  --input:#232936;
  --scroll:rgba(255,255,255,.18);
}

/* ========== СТАТУС-БАР ========== */
.status{
  position:relative;z-index:20;
  height:52px;flex-shrink:0;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 30px 6px;
  font-size:13px;font-weight:600;color:var(--text);
  pointer-events:none;
}
@media (max-width:699px),(max-height:899px){
  .status{height:46px;padding:0 22px 5px}
}
.status .s-left{display:flex;align-items:center;gap:5px}
.status .s-right{display:flex;align-items:center;gap:5px;font-size:12px}
.batt{width:22px;height:11px;border:1.4px solid var(--text);border-radius:3px;position:relative;opacity:.9}
.batt::after{content:'';position:absolute;right:-3px;top:3px;width:2px;height:5px;background:var(--text);border-radius:0 2px 2px 0}
.batt i{display:block;height:100%;background:var(--text);border-radius:1px;transition:width .5s}

/* ========== РАБОЧИЙ СТОЛ ========== */
.desktop{
  position:absolute;top:52px;left:0;right:0;bottom:0;
  overflow:hidden;
  padding:0 18px 130px;
  background:var(--wall);
  transition:background .35s,opacity .28s,transform .28s;
  scrollbar-width:none;
}
@media (max-width:699px),(max-height:899px){
  .desktop{top:46px;padding:0 14px 130px}
}
.desktop::-webkit-scrollbar{display:none}
.desktop.hidden{opacity:0;transform:scale(.94);pointer-events:none}

.desk-head{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;margin:14px 0;
  background:var(--head);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:20px;
  border:1px solid rgba(255,255,255,.14);
}
.desk-head .av{
  width:42px;height:42px;border-radius:14px;flex-shrink:0;
  display:grid;place-items:center;font-size:22px;
  background:linear-gradient(140deg,var(--accent),var(--purple));
  box-shadow:0 4px 12px rgba(0,0,0,.18);
}
.desk-head .info{flex:1;min-width:0}
.desk-head .nick{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desk-head .shop{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desk-head .cap{text-align:right;flex-shrink:0}
.desk-head .cap b{display:block;font-size:14px;color:var(--text)}
.desk-head .cap span{font-size:10px;color:var(--text2)}

.app-viewport{width:100%;overflow:hidden;position:relative;touch-action:pan-y;contain:paint}
.app-pages{display:flex;overflow:visible;touch-action:pan-y;transition:transform .28s ease;will-change:transform}
.app-page{flex:0 0 auto;width:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(5,minmax(70px,auto));gap:6px 6px;align-content:start;padding:10px 0 0;box-sizing:border-box}
.page-dots{display:flex;justify-content:center;align-items:center;gap:9px;padding:14px 0 10px;min-height:22px;position:relative;z-index:5}
.page-dots button{width:9px;height:9px;flex:0 0 9px;border:0;border-radius:50%;background:rgba(255,255,255,.42);padding:0;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.page-dots button.active{background:#fff;width:22px;flex-basis:22px;height:9px;border-radius:6px;box-shadow:0 0 7px rgba(255,255,255,.35)}

.app-ic{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;transition:transform .12s;
}
.app-ic:active{transform:scale(.88)}
.app-ic .bubble{
  width:min(58px,14.5vw);height:min(58px,14.5vw);border-radius:15px;
  display:grid;place-items:center;font-size:27px;line-height:1;
  box-shadow:0 6px 16px rgba(10,20,50,.22),inset 0 1px 0 rgba(255,255,255,.35);
  position:relative;
}
.app-ic .bubble .badge{
  position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;
  background:var(--red);color:#fff;border-radius:10px;
  font-size:11px;font-weight:700;display:grid;place-items:center;
  border:2px solid rgba(255,255,255,.6);
}
.app-ic .name{
  font-size:10px;font-weight:600;color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.55);
  text-align:center;line-height:1.1;max-width:76px;
}
[data-theme="light"] .app-ic .name{text-shadow:0 1px 4px rgba(0,0,0,.35)}

.dock{
  position:absolute;left:14px;right:14px;bottom:24px;
  z-index:15;
  display:flex;justify-content:space-around;align-items:center;
  padding:9px 8px;
  background:var(--dock);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-radius:26px;
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 8px 26px rgba(0,0,0,.22);
  transition:background .35s,opacity .25s,transform .25s;
}
.dock.hidden{opacity:0;transform:translateY(24px);pointer-events:none}
.dock .app-ic .name{display:none}
.dock .app-ic .bubble{width:54px;height:54px;border-radius:17px;font-size:27px}

.homebar{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:132px;height:5px;border-radius:3px;
  background:var(--text);opacity:.35;z-index:30;cursor:pointer;
  transition:opacity .2s;
}
.homebar:hover{opacity:.7}

/* ========== ОКНО ПРИЛОЖЕНИЯ ========== */
.app-win{
  position:absolute;inset:0;z-index:50;
  background:var(--bg);
  display:flex;flex-direction:column;
  transform:scale(.2);opacity:0;pointer-events:none;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.05),opacity .22s;
  overflow:hidden;
}
.app-win.open{transform:scale(1);opacity:1;pointer-events:auto}

.app-head{
  flex-shrink:0;position:relative;z-index:5;
  padding:52px 14px 10px;
  display:flex;align-items:center;gap:10px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
@media (max-width:699px),(max-height:899px){
  .app-head{padding:46px 14px 10px}
}
.back-btn{
  width:36px;height:36px;flex-shrink:0;
  border:none;border-radius:12px;cursor:pointer;
  background:var(--surface2);color:var(--accent);
  font-size:20px;font-weight:700;line-height:1;
  display:grid;place-items:center;
  transition:transform .12s,background .2s;
}
.back-btn:active{transform:scale(.9)}
.app-title{
  font-size:18px;font-weight:700;color:var(--text);
  display:flex;align-items:center;gap:8px;flex:1;
}
.app-title .ttl-emo{font-size:20px}

.app-body{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:14px 14px 30px;
  scrollbar-width:thin;
  scrollbar-color:var(--scroll) transparent;
}
.app-body::-webkit-scrollbar{width:6px}
.app-body::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:3px}
/* VIP-клуб: компактные карточки и кнопки без лишних вертикальных отступов */
.app-body.vip-screen .card{margin-bottom:9px;padding:12px 13px}
.app-body.vip-screen .card-title{margin-bottom:7px}
.app-body.vip-screen .btn{margin-top:5px!important;min-height:42px;line-height:1.2;white-space:normal}
.app-body.vip-screen .card .btn{margin-bottom:0}
.app-body.vip-screen{padding-bottom:18px}


/* ========== КОМПОНЕНТЫ ========== */
.card{
  background:var(--surface);border-radius:18px;padding:14px;
  margin-bottom:12px;border:1px solid var(--border);
  box-shadow:var(--shadow);
}
.card.tight{padding:11px 13px}
.card-title{
  font-size:13px;font-weight:700;color:var(--text2);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row.wrap{flex-wrap:wrap}
.muted{color:var(--text2);font-size:12px}
.tiny{font-size:11px;color:var(--text3)}
.big{font-size:30px;font-weight:800;color:var(--text);letter-spacing:-.5px}
.mid{font-size:18px;font-weight:700;color:var(--text)}
.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}
.accent{color:var(--accent)}.purple{color:var(--purple)}

.btn{
  border:none;cursor:pointer;font-family:inherit;
  padding:11px 16px;border-radius:13px;font-size:13.5px;font-weight:650;
  background:var(--accent);color:#fff;
  transition:transform .1s,filter .18s,background .2s,opacity .2s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.42;cursor:default}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.yellow{background:var(--yellow);color:#2a1e00}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:11px}
.btn.xs{padding:6px 9px;font-size:11px;border-radius:9px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

input[type=text],input[type=number],input[type=password],select{
  width:100%;padding:11px 13px;border-radius:12px;
  border:1px solid var(--border);background:var(--input);color:var(--text);
  font-family:inherit;font-size:14px;outline:none;
  transition:border .2s;
}
input:focus,select:focus{border-color:var(--accent)}
input[type=range]{
  -webkit-appearance:none;width:100%;height:5px;border-radius:3px;
  background:var(--surface3);outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--accent);cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}
input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;border:none;
  background:var(--accent);cursor:pointer;
}

.bar{height:7px;border-radius:4px;background:var(--surface3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .4s}
.prog{display:flex;align-items:center;gap:8px}
.prog .bar{flex:1}

.pill{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:650;
  background:var(--surface3);color:var(--text2);
}
.pill.g{background:rgba(23,163,74,.15);color:var(--green)}
.pill.r{background:rgba(224,52,43,.15);color:var(--red)}
.pill.y{background:rgba(216,150,20,.16);color:var(--yellow)}
.pill.b{background:rgba(59,110,245,.15);color:var(--accent)}

.item{
  display:flex;align-items:center;gap:11px;
  padding:10px 0;border-bottom:1px solid var(--border);
}
.item:last-child{border-bottom:none}
.item .ico{
  width:42px;height:42px;flex-shrink:0;border-radius:13px;
  display:grid;place-items:center;font-size:21px;
  background:var(--surface2);
}
.item .txt{flex:1;min-width:0}
.item .txt .n{font-size:13.5px;font-weight:650;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .txt .s{font-size:11.5px;color:var(--text2);margin-top:2px}
.item .val{text-align:right;flex-shrink:0;font-size:13px;font-weight:650;color:var(--text)}

.empty{
  text-align:center;padding:34px 16px;color:var(--text3);font-size:13px;
}
.empty .e{font-size:38px;display:block;margin-bottom:10px;opacity:.55}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{
  padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600;
  background:var(--surface);color:var(--text2);border:1px solid var(--border);
  cursor:pointer;transition:all .18s;white-space:nowrap;
}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.acc-head{
  display:flex;align-items:center;gap:10px;padding:12px;
  background:var(--surface);border-radius:15px;cursor:pointer;
  margin-bottom:8px;border:1px solid var(--border);
  transition:background .2s;
}
.acc-head:active{background:var(--surface2)}
.acc-head .e{font-size:22px}
.acc-head .t{flex:1;font-size:14px;font-weight:700;color:var(--text)}
.acc-head .c{font-size:12px;color:var(--text2);font-weight:600}
.acc-head .ar{color:var(--text3);font-size:13px;transition:transform .25s}
.acc-head.open .ar{transform:rotate(90deg)}
.acc-body{display:none;padding:0 4px 10px}
.acc-body.open{display:block}

/* ========== УВЕДОМЛЕНИЯ ========== */
.notif-wrap{
  position:absolute;top:14px;left:12px;right:12px;z-index:200;
  display:flex;flex-direction:column;gap:9px;
  pointer-events:none;
}
.push{
  background:var(--surface);border:1px solid var(--border);
  border-radius:19px;padding:12px 14px;
  display:flex;gap:11px;align-items:flex-start;
  box-shadow:var(--shadow-lg);
  animation:pushIn .45s cubic-bezier(.2,.9,.3,1.15);
  pointer-events:auto;
  backdrop-filter:blur(14px);
}
.push.out{animation:pushOut .32s ease forwards}
/* Свайп уведомления влево или вправо */
.push{
  touch-action:pan-y;
  will-change:transform,opacity;
}
.push.swiping{transition:none}
.push.swipe-out{
  transition:transform .22s ease,opacity .22s ease;
  opacity:0;
}
.push .pico{
  width:36px;height:36px;flex-shrink:0;border-radius:11px;
  display:grid;place-items:center;font-size:19px;background:var(--surface2);
}
.push .ptxt{flex:1;min-width:0}
.push .pt{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px}
.push .pd{font-size:12px;color:var(--text2);line-height:1.35}
@keyframes pushIn{from{transform:translateY(-130%) scale(.9);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes pushOut{to{transform:translateY(-130%) scale(.9);opacity:0}}

/* ========== МОДАЛКИ ========== */
.modal-wrap{
  position:absolute;inset:0;z-index:300;
  background:rgba(5,8,15,.55);
  backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;
  padding:24px;
}
.modal-wrap.open{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:320px;max-height:78%;
  background:var(--surface);border-radius:24px;
  padding:20px;overflow-y:auto;
  box-shadow:var(--shadow-lg);
  animation:modalIn .3s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes modalIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:17px;font-weight:750;color:var(--text);margin-bottom:9px}
.modal p{font-size:13.5px;color:var(--text2);line-height:1.5;margin-bottom:14px}
.modal .m-act{display:flex;gap:8px;margin-top:14px}
.modal .m-act .btn{flex:1}

/* ========== ВСПЛЫВАЮЩИЕ ЧИСЛА ========== */
.float{
  position:absolute;font-size:16px;font-weight:800;z-index:250;
  pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.3);
  animation:floatUp 1.15s ease-out forwards;
}
@keyframes floatUp{
  0%{transform:translateY(0) scale(.7);opacity:0}
  18%{transform:translateY(-8px) scale(1.15);opacity:1}
  100%{transform:translateY(-62px) scale(1);opacity:0}
}

.fade-in{animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
canvas{display:block;width:100%;border-radius:12px}
</style>
</head>
<body>

<div class="phone">
  <div class="side-btn pw"></div>
  <div class="side-btn vu"></div>
  <div class="side-btn vd"></div>
  <div class="side-btn sl"></div>
  <div class="island"></div>
  <div class="screen" id="screen">

    <div class="status">
      <div class="s-left"><span id="stTime">12:00</span></div>
      <div class="s-right">
        <span id="stSig">📶</span>
        <span id="stWifi">📡</span>
        <div class="batt"><i id="stBatt" style="width:78%"></i></div>
        <span id="stBattTxt">78%</span>
      </div>
    </div>

    <div class="desktop" id="desktop">
      <div class="desk-head">
        <div class="av" id="dskAv">🧑‍💼</div>

const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; };
const rnd = (a,b)=>Math.random()*(b-a)+a;
const rint = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

function fmt(n){
  if(n==null||isNaN(n))return '0';
  const neg=n<0;n=Math.abs(n);
  let s;
  if(n<1000)s=Math.floor(n).toString();
  else if(n<1e6)s=(n/1e3).toFixed(n<1e4?2:1).replace(/\.?0+$/,'')+'K';
  else if(n<1e9)s=(n/1e6).toFixed(n<1e7?2:1).replace(/\.?0+$/,'')+'M';
  else if(n<1e12)s=(n/1e9).toFixed(n<1e10?2:1).replace(/\.?0+$/,'')+'B';
  else s=(n/1e12).toFixed(1).replace(/\.?0+$/,'')+'T';
  return (neg?'−':'')+s;
}
const fmtMoney = n => fmt(n)+' ₽';
function fmtTime(sec){
  sec=Math.max(0,Math.floor(sec));
  const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  if(h)return h+'ч '+m+'м';
  if(m)return m+'м '+s+'с';
  return s+'с';
}
function esc(s){ return String(s).replace(/[<>&"']/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c])); }

let audioCtx = null;
function beep(freq=440, dur=0.08, type='sine', vol=0.05){
  if(!S||!S.sound)return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.value=vol;
    o.connect(g);g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

   ============================================================ */
function push(emoji, title, desc){
  const wrap = $('notifWrap');
  if(!wrap) return;
  const n = el('div','push');
  n.innerHTML = `<div class="pico">${emoji}</div><div class="ptxt"><div class="pt">${esc(title)}</div><div class="pd">${esc(desc||'')}</div></div>`;
  // Смахивание пальцем на телефоне или мышью на компьютере.
  let startX = 0, startY = 0, currentX = 0, dragging = false;
  n.addEventListener('pointerdown', e=>{
    if(e.button !== undefined && e.button !== 0) return;
    startX = e.clientX;
    startY = e.clientY;
    currentX = 0;
    dragging = true;
    n.classList.add('swiping');
    try{ n.setPointerCapture(e.pointerId); }catch(_){}
  });
  n.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    // Если жест преимущественно вертикальный, не перехватываем его.
    if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 12){
      dragging = false;
      n.classList.remove('swiping');
      n.style.transform = '';
      n.style.opacity = '';
      return;
    }
    currentX = dx;
    n.style.transform = `translateX(${dx}px) rotate(${dx * 0.025}deg)`;
    n.style.opacity = String(Math.max(0.25, 1 - Math.abs(dx) / 260));
  });
  const finishSwipe = ()=>{
    if(!dragging) return;
    dragging = false;
    n.classList.remove('swiping');
    if(Math.abs(currentX) > 75){
      n.classList.add('swipe-out');
      n.style.transform = `translateX(${currentX < 0 ? '-120%' : '120%'}) rotate(${currentX < 0 ? '-8deg' : '8deg'})`;
      n.style.opacity = '0';
      setTimeout(()=>n.remove(), 230);
    }else{
      n.style.transform = '';
      n.style.opacity = '';
    }
  };
  n.addEventListener('pointerup', finishSwipe);
  n.addEventListener('pointercancel', finishSwipe);
  wrap.appendChild(n);
  beep(660,0.1,'sine',0.05);
  setTimeout(()=>{ if(n.isConnected){ n.classList.add('out'); setTimeout(()=>n.remove(),320); } }, 3800);
  while(wrap.children.length>4) wrap.firstChild.remove();
}

function showModal(opts){
  const wrap = $('modalWrap');
  const { title, text, body, actions, onClose } = opts;
  wrap.innerHTML = '';
  const m = el('div','modal');
  if(title) m.appendChild(el('h3',null,title));
  if(text) m.appendChild(el('p',null,text));
  if(body) m.appendChild(body);
  const acts = el('div','m-act');
  (actions||[]).forEach(a=>{
    const b = el('button','btn '+(a.cls||''), a.label);
    b.onclick = ()=>{
      if(a.keepOpen!==true) closeModal();
      if(a.onClick) a.onClick();
    };
    acts.appendChild(b);
  });
  if(actions&&actions.length) m.appendChild(acts);
  wrap.appendChild(m);
  wrap.classList.add('open');
  wrap.onclick = e=>{ if(e.target===wrap){ closeModal(); if(onClose)onClose(); } };
}
function closeModal(){
  const wrap = $('modalWrap');
  wrap.classList.remove('open');
  wrap.innerHTML = '';
}

function getPrice(id){
  const p = PROD_BY_ID[id]; if(!p) return 0;
  const mk = S.prices[id];
  return mk ? Math.round(p.basePrice * mk) : p.basePrice;
}
const getStock = id => S.stock[id]?.qty || 0;

function getShelfCap(){
  return 30
    + S.upgrades.area*2
    + (S.upgrades.shelves-1)*80
    + S.upgrades.fridges*60
    + S.upgrades.freezers*60;
}
function getStockCount(){
  let t=0; for(const k in S.stock) t += S.stock[k].qty; return t;
}

function addStock(id, qty, cost){
  const p = PROD_BY_ID[id];
  if(!p) return 0;
  qty = Math.floor(qty);
  if(qty<=0) return 0;
  if(!S.stock[id]) S.stock[id] = { qty:0, cost: cost || p.baseCost, addedDay: S.day, expires: null };
  S.stock[id].qty += qty;
  if(cost && (S.stock[id].qty - qty) <= 0) S.stock[id].cost = cost;
  // срок годности
  if(p.shelf < 99999){
    const newExp = Date.now() + p.shelf*3600*1000;
    S.stock[id].expires = S.stock[id].expires ? Math.min(S.stock[id].expires, newExp) : newExp;
  } else {
    S.stock[id].expires = null;
  }
  return qty;
}

function addRep(d){
  if(typeof d !== 'number' || isNaN(d)) return;
  S.rep = clamp(S.rep + d, 0, 100);
}

function addXP(n){
  S.xp += n;
  while(S.xp >= xpForLevel(S.level) && S.level<50){
    S.xp -= xpForLevel(S.level);
    S.level++;
    push('⬆️','Новый уровень!','Магазин достиг уровня '+S.level);
    beep(880,0.15,'sine',0.08);
  }
}
const xpForLevel = l => Math.floor(100*Math.pow(l,1.4));

function logEvent(msg){
  if(typeof msg !== 'string') return;
  S.events.unshift({ t: Date.now(), msg });
  if(S.events.length>40) S.events.length = 40;
}

function makeCustomer(){
  const old = Math.random()<0.22;
  const isMale = Math.random()<0.48;
  let name, age;
  if(old){
    name = isMale ? pick(NAMES_M_OLD) : pick(NAMES_F_OLD);
    age = rint(58,86);
  } else {
    name = isMale ? pick(NAMES_M) : pick(NAMES_F);
    age = rint(16,55);
  }
  const emoji = pick(EMOJI_BUYERS);
  const avail = PRODUCTS.filter(p=>getStock(p.id)>0);
  if(avail.length===0) return null;
  const nItems = rint(2,6);
  const cart = [];
  for(let i=0;i<nItems;i++){
    const p = pick(avail);
    if(cart.find(c=>c.id===p.id)) continue;
    cart.push({ id:p.id, qty: rint(1,3) });
  }
  if(cart.length===0) return null;
  const mood = Math.random()<0.55?'ok':(Math.random()<0.7?'happy':'angry');
  return {
    id: 'c'+Date.now()+Math.random().toString(36).slice(2,7),
    name, age, emoji, cart, mood, waited: 0,
    createdAt: Date.now(),
    patience: 30 + S.rep*0.4 + (S.upgrades.lighting*3) + (S.upgrades.music*3)
  };
}

/* ---- Обслужить ---- */
function serveCustomer(cust){
  const missing = [];
  const sold = [];
  let total = 0;
  cust.cart.forEach(c=>{
    if(getStock(c.id) >= c.qty){
      const price = getPrice(c.id);
      const revenue = price*c.qty;
      total += revenue;
      sold.push({ id:c.id, qty:c.qty, price, revenue });
    } else {
      missing.push(c.id);
    }
  });
  if(sold.length===0){
    addRep(-1);
    logEvent(`😡 ${cust.name} ушёл(ла) злым(ой) — товара нет`);
    beep(220,0.15,'sawtooth',0.05);
    return { ok:false, total:0 };
  }
  const dt = (Date.now() - cust.createdAt)/1000;
  let tip = 0;
  if(dt < 2) tip = total*0.05;
  S.lastCustServe = Date.now();

  // Изъять со склада
  sold.forEach(s=>{
    S.stock[s.id].qty -= s.qty;
    if(S.stock[s.id].qty<=0) delete S.stock[s.id];
    S.stats.topGoods[s.id] = (S.stats.topGoods[s.id]||0) + s.qty;
  });

  const earned = total + tip;
  S.money += earned;
  S.stats.earned += earned;
  S.stats.todayEarned += earned;
  const soldQty = sold.reduce((a,s)=>a+s.qty,0);
  S.stats.sold += soldQty;
  S.stats.servedNoErr++;
  S.stats.hourlySales[S.hour] += soldQty;

  // Миссии
  sold.forEach(it=>{
    const cat = PROD_BY_ID[it.id].cat;
    S.stats.missionsToday[cat] = (S.stats.missionsToday[cat]||0) + it.qty;
  });
  S.stats.missionsToday.sold += soldQty;
  S.stats.missionsToday.served++;
  S.stats.missionsToday.earn = S.stats.todayEarned;

  // Репутация
  if(cust.mood==='happy') addRep(0.15);
  else if(cust.mood==='angry') addRep(-0.1);
  else addRep(0.05);
  if(missing.length>0) addRep(-0.3*missing.length);

  if(tip>0) logEvent(`⚡ ${cust.name} — быстрая продажа! +${fmt(tip)} ₽ чаевых`);
  else logEvent(`${cust.emoji} ${cust.name} купил(а) ${sold.length} поз. — +${fmt(earned)} ₽`);

  addXP(1 + Math.floor(sold.length*0.5));
  try{ checkMissions(); }catch(e){}
  return { ok:true, total:earned, sold, missing };
}

/* ---- ИИ кассиров ---- */
function autoServe(){
  const cashiers = staffByType('cashier').filter(s=>s.morale>20);
  if(!cashiers.length || S.queue.length===0) return;
  const maxServes = cashiers.length * 2;
  let served = 0;
  while(served<maxServes && S.queue.length>0){
    const c = S.queue[0];
    const r = serveCustomer(c);
    S.queue.shift();
    served++;
    if(!r.ok) break;
  }
}

/* ---- Воры ---- */
function trySteal(){
  const hasGuard = hasStaff('guard');
  const camLvl = S.upgrades.cameras;
  const guardLvl = hasGuard ? Math.max(...staffByType('guard').map(g=>g.level)) : 0;
  const catchChance = clamp(0.15 + guardLvl*0.07 + camLvl*0.06, 0.05, 0.95);
  const caught = Math.random()<catchChance;
  if(caught){
    S.stats.thieves++;
    S.stats.missionsToday.thief = (S.stats.missionsToday.thief||0) + 1;
    addRep(0.5);
    logEvent('🛡 Пойман вор! +0.5 репутации');
    beep(880,0.12,'square',0.05);
  } else {
    const ids = Object.keys(S.stock);
    if(ids.length){
      const id = pick(ids);
      const stealQty = Math.min(S.stock[id].qty, rint(1,4));
      S.stock[id].qty -= stealQty;
      if(S.stock[id].qty<=0) delete S.stock[id];
      addRep(-2);
      const lost = PROD_BY_ID[id].basePrice*stealQty;
      logEvent(`🚨 Вор украл ${stealQty}× ${PROD_BY_ID[id].name} (−${fmt(lost)} ₽)`);
    }
  }
}
function damageRandomStock(frac){
  Object.keys(S.stock).forEach(id=>{
    const dmg = Math.ceil(S.stock[id].qty*frac);
    S.stock[id].qty -= dmg;
    if(S.stock[id].qty<=0) delete S.stock[id];
  });
}
function giftStock(){
  const avail = PRODUCTS.filter(p=>p.baseCost<500);
  const p = pick(avail);
  const q = rint(5,20);
  addStock(p.id, q, 0);
  logEvent(`🎁 Подарок: ${q}× ${p.name}`);
}
function getExpiredCount(){
  const now = Date.now();
  let n=0;
  for(const id in S.stock){
    if(S.stock[id].expires && S.stock[id].expires<now) n += S.stock[id].qty;
  }
  return n;
}
function expireStock(){
  const now = Date.now();
  let lost=0;
  for(const id in S.stock){
    if(S.stock[id].expires && S.stock[id].expires<now){
      lost += S.stock[id].qty * PROD_BY_ID[id].baseCost;
      delete S.stock[id];
    }
  }
  if(lost>0){
    logEvent('⌛ Списана просрочка: −'+fmt(lost)+' ₽');
    addRep(-1);
  }
}
function payroll(){
  let total=0;
  S.staff.forEach(st=>{ total += st.salary; });
  if(total>0) S.money -= total;
}

/* ---- Доставки ---- */
function processDeliveries(){
  const now = Date.now();
  activeDeliveries = activeDeliveries.filter(ord=>{
    if(ord.arrivesAt <= now){
      let delivered = 0;
      ord.items.forEach(it=>{
        const defQty = Math.floor(it.qty * (ord.defectChance||0) * Math.random());
        const goodQty = Math.max(0, it.qty - defQty);
        const added = addStock(it.id, goodQty, it.cost);
        delivered += added;
      });
      push('📦','Доставка прибыла', delivered+' шт загружено на склад');
      beep(660,0.1,'sine',0.05);
      logEvent(`📦 Доставка: +${delivered} шт`);
      return false;
    }
    return true;
  });
}

/* ============================================================
   ИГРОВОЙ ЦИКЛ
   ============================================================ */
let tickCounter = 0;
function tick(){
  if(!S) return;
  tickCounter++;

  // Игровое время: 1 тик = 1 игровая минута
  S.minute++;
  if(S.minute>=60){ S.minute=0; S.hour=(S.hour+1)%24; }

  // Смена дня каждые 24 игровых часа
  if(tickCounter % 1440 === 0) endDay();

  // Сезон каждые 7 дней
  const seasonIdx = Math.floor((S.day-1)/7) % 4;
  if(seasonIdx !== S.season){
    S.season = seasonIdx;
    if(!S.stats.seasonsSeen.includes(seasonIdx)) S.stats.seasonsSeen.push(seasonIdx);
  }

  // Поток покупателей
  const now = Date.now();
  const flow = customerFlowMult();
  if(S.open && S.queue.length<10){
    if(now - S.lastCustomerAt > 1000/flow && Math.random()<0.7){
      const c = makeCustomer();
      if(c){ S.queue.push(c); S.lastCustomerAt = now; }
    }
  }

  // Таймауты в очереди
  if(S.queue.length){
    S.queue = S.queue.filter(c=>{
      c.waited++;
      if(c.waited > c.patience){
        addRep(-0.5);
        logEvent(`😤 ${c.name} не дождался(ась) и ушёл(ла)`);
        return false;
      }
      return true;
    });
  }

  // ИИ кассиров
  autoServe();

  // Вор раз в ~90 сек
  if(tickCounter%90===0 && S.open && Math.random()<0.4) trySteal();

  // Зарплаты раз в 60 сек
  if(tickCounter%60===0) payroll();

  // Чистота
  if(tickCounter%15===0){
    if(hasStaff('cleaner')) S.clean = clamp(S.clean+2,0,100);
    else {
      S.clean = clamp(S.clean-1,0,100);
      if(S.clean<30) addRep(-0.15);
    }
  }

  // Мораль сотрудников
  if(tickCounter%30===0){
    S.staff.slice().forEach(st=>{
      st.morale = clamp(st.morale-1,0,100);
      if(st.morale<20 && Math.random()<0.1 && Math.random()<0.3){
        logEvent(`👋 ${st.name} уволился(ась)`);
        push('👋','Сотрудник уволился',`${st.name} (${st.role})`);
        S.staff = S.staff.filter(x=>x.id!==st.id);
      }
    });
  }

  // Просрочка
  if(tickCounter%60===0) expireStock();

  // Случайные события
  if(Math.random() < 1/75) fireRandomEvent();

  // Тик эффектов
  for(const k in S.eff){
    if(k.endsWith('Time') && S.eff[k]>0) S.eff[k] = Math.max(0, S.eff[k]-1);
  }

  // Обновление UI
  renderStatusBar();
  // Точечное обновление открытых приложений
  if(currentApp === 'cash' && tickCounter%2===0) updateCashNumbers();

  // Автосохранение
  if(tickCounter%5===0) save();

  // Проверка ачивок
  if(tickCounter%10===0) checkAch();
}

function customerFlowMult(){
  let m = 1;
  const h = S.hour;
  if(h>=7 && h<10) m*=1.4;
  else if(h>=12 && h<14) m*=1.2;
  else if(h>=17 && h<21) m*=1.8;
  else if(h>=23 || h<6) m*=0.2;
  m *= 0.5 + S.rep/100;
  m *= 1 + S.upgrades.lighting*0.05 + S.upgrades.music*0.06 + S.upgrades.parking*0.07;
  m *= 1 + staffByType('promoter').length*0.15 + staffByType('merch').length*0.1;
  if(S.marketing.boostTime>Date.now()) m *= S.marketing.boostMult;
  if(S.eff.publicMult && S.eff.publicTime>0) m *= S.eff.publicMult;
  if(S.eff.weatherMult && S.eff.weatherTime>0) m *= S.eff.weatherMult;
  if(S.eff.crisisMult && S.eff.crisisTime>0) m *= S.eff.crisisMult;
  if(S.eff.compMult && S.eff.compTime>0) m *= S.eff.compMult;
  m *= 1 + S.level*0.02;
  return clamp(m, 0.1, 8);
}

function endDay(){
  S.day++;
  S.stats.best_day = Math.max(S.stats.best_day, S.stats.todayEarned);
  S.stats.dailyProfit.push({ day: S.day-1, profit: S.stats.todayEarned, spent: S.stats.spent });
  if(S.stats.dailyProfit.length>30) S.stats.dailyProfit.shift();
  S.stats.todayEarned = 0;
  S.stats.servedNoErr = 0;
  logEvent(`📅 День ${S.day} начался`);
  push('📅','Новый день',`День ${S.day}. Сезон: ${['Зима','Весна','Лето','Осень'][S.season]}`);
  checkMissions();
  generateMissions();
}

function fireRandomEvent(){
  const totalW = EVENTS.reduce((a,e)=>a+e.w,0);
  let r = Math.random()*totalW;
  for(const e of EVENTS){
    r -= e.w;
    if(r<=0){ applyEvent(e); return; }
  }
}
function applyEvent(e){
  push(e.e, e.t, e.d);
  logEvent(`${e.e} ${e.t}`);
  try{ e.apply(); }catch(err){ console.warn(err); }
}

function checkAch(){
  ACHIEVEMENTS.forEach(a=>{
    if(!S.ach[a.id]){
      try{
        if(a.check(S)){
          S.ach[a.id] = true;
          push('🏆','Достижение!', a.e+' '+a.name);
          beep(1046,0.15,'sine',0.07);
        }
      }catch(e){}
    }
  });
}

/* ---- Миссии ---- */
const MISSION_POOL = [
  {id:'sell_dairy', name:'Продай 50 единиц молочки', reward:20000, target:50, type:'cat', cat:'dairy'},
  {id:'sell_bread', name:'Продай 30 единиц хлеба', reward:12000, target:30, type:'cat', cat:'bread'},
  {id:'serve_100', name:'Обслужи 100 покупателей без ошибок', reward:'rep5', target:100, type:'served'},
  {id:'earn_500k', name:'Заработай 500 000 ₽ за день', reward:'x2', target:500000, type:'earn'},
  {id:'sell_200', name:'Продай 200 товаров', reward:35000, target:200, type:'sold'},
  {id:'catch_thief', name:'Поймай 3 вора', reward:15000, target:3, type:'thief'}
];
function generateMissions(){
  const m = {};
  const picked = [];
  let attempts = 0;
  while(picked.length<3 && attempts<50){
    attempts++;
    const pm = pick(MISSION_POOL);
    if(!picked.find(x=>x.id===pm.id)) picked.push(pm);
  }
  picked.forEach(pm=>{
    m[pm.id] = { ...pm, progress: 0, done: false };
  });
  S.missions = m;
  S.stats.missionsToday = { dairy:0, bread:0, served:0, sold:0, earn:0, thief:0 };
}
function checkMissions(){
  if(!S.missions) return;
  Object.values(S.missions).forEach(m=>{
    if(m.done) return;
    let done = false;
    if(m.type==='cat') done = (S.stats.missionsToday[m.cat]||0) >= m.target;
    else if(m.type==='served') done = S.stats.servedNoErr >= m.target;
    else if(m.type==='sold') done = (S.stats.missionsToday.sold||0) >= m.target;
    else if(m.type==='earn') done = S.stats.todayEarned >= m.target;
    else if(m.type==='thief') done = (S.stats.missionsToday.thief||0) >= m.target;
    if(done){
      m.done = true;
      if(typeof m.reward==='number') S.money += m.reward;
      else if(m.reward==='rep5') addRep(5);
      else if(m.reward==='x2') S.eff.x2 = true;
      push('🎯','Миссия выполнена!', m.name);
    }
  });
}

let desktopPage = 0;
function renderDesktop(){
  const grid = $('appGrid'); grid.innerHTML = '';
  const pageCount = Math.max(1, Math.ceil(APPS.length / 20));
  desktopPage = Math.min(desktopPage, pageCount - 1);
  for(let i=0;i<pageCount;i++){
    const page=el('div','app-page');
    page.style.flex = `0 0 ${100/pageCount}%`;
    page.style.width = `${100/pageCount}%`;
    page.style.minWidth = `${100/pageCount}%`;
    APPS.slice(i*20,(i+1)*20).forEach(app=>page.appendChild(makeIcon(app,true)));
    grid.appendChild(page);
  }
  grid.style.width = `${pageCount*100}%`;
  grid.style.transform = `translate3d(-${desktopPage*(100/pageCount)}%,0,0)`;
  const dots=$('pageDots'); dots.innerHTML='';
  for(let i=0;i<pageCount;i++){
    const dot=el('button',i===desktopPage?'active':''); dot.setAttribute('aria-label','Страница '+(i+1));
    dot.onclick=()=>setDesktopPage(i); dots.appendChild(dot);
  }
  const dock = $('dock'); dock.innerHTML = '';
  DOCK_APPS.forEach(id=> dock.appendChild(makeIcon(APPS.find(a=>a.id===id), false)));
  $('dskNick').textContent = S.nick;
  $('dskShop').textContent = S.shopName + ' · Ур. '+S.level;
  $('dskAv').textContent = S.avatar;
  $('dskCap').textContent = fmtMoney(totalCapital());
  document.documentElement.setAttribute('data-theme', S.theme);
}
function setDesktopPage(n){
  const count=Math.max(1,Math.ceil(APPS.length/20));
  desktopPage=Math.max(0,Math.min(count-1,n));
  $('appGrid').style.transform=`translate3d(-${desktopPage*(100/count)}%,0,0)`;
  [...$('pageDots').children].forEach((d,i)=>d.classList.toggle('active',i===desktopPage));
}
(function enableHorizontalPages(){
  const area=$('desktop'); let sx=0,sy=0,tracking=false;
  area.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;tracking=true;},{passive:true});
  area.addEventListener('touchend',e=>{if(!tracking)return;tracking=false;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2)setDesktopPage(desktopPage+(dx<0?1:-1));},{passive:true});
  let px=0,py=0,down=false;
  area.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;px=e.clientX;py=e.clientY;down=true;});
  area.addEventListener('pointerup',e=>{if(!down)return;down=false;const dx=e.clientX-px,dy=e.clientY-py;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)setDesktopPage(desktopPage+(dx<0?1:-1));});
})();
function makeIcon(app, showName){
  const d = el('div','app-ic');
  const bubble = el('div','bubble');
  bubble.style.background = app.color;
  bubble.style.color = '#fff';
  bubble.textContent = app.emoji;
  d.appendChild(bubble);
  if(showName) d.appendChild(el('div','name', app.name));
  d.onclick = ()=> openApp(app.id);
  return d;
}
function totalCapital(){
  let c = S.money;
  for(const id in S.stock) c += S.stock[id].qty * PROD_BY_ID[id].baseCost;
  c += S.upgrades.area*500 + S.upgrades.registers*3000;
  for(const k in S.depts) if(S.depts[k]) c += 50000;
  c += S.branches*500000;
  return c;
}

let currentApp = null;

function openApp(id){
  const app = APPS.find(a=>a.id===id);
  if(!app) return;
  currentApp = id;
  $('appTitle').innerHTML = `<span class="ttl-emo">${app.emoji}</span><span>${app.name}</span>`;
  const win = $('appWin');
  win.classList.add('open');
  beep(520,0.06,'sine',0.04);
  renderApp(id);
}
function closeApp(){
  currentApp = null;
  $('appWin').classList.remove('open');
  renderDesktop();
  beep(380,0.06,'sine',0.04);
}
function renderApp(id){
  const body = $('appBody');
  body.innerHTML = '';
  switch(id){
    case 'home': renderHome(body); break;
    case 'cash': renderCash(body); break;
    case 'bank': renderBank(body); break;
    case 'warehouse': renderWarehouse(body); break;
    case 'buy': renderBuy(body); break;
    case 'prices': renderPrices(body); break;
    case 'staff': renderStaff(body); break;
    case 'expand': renderExpand(body); break;
    case 'marketing': renderMarketing(body); break;
    case 'analytics': renderAnalytics(body); break;
    case 'events': renderEvents(body); break;
    case 'ach': renderAch(body); break;
    case 'settings': renderSettings(body); break;
    case 'browser': renderBrowser(body); break;
    case 'estate': renderExtraApp(body,id); break; case 'cars': renderExtraApp(body,id); break;
    case 'credit': renderExtraApp(body,id); break; case 'business': renderExtraApp(body,id); break;
    case 'hotel': renderExtraApp(body,id); break; case 'casino': renderExtraApp(body,id); break;
    case 'cases': renderExtraApp(body,id); break; case 'skins': renderExtraApp(body,id); break;

    log.appendChild(el('div','item',`<div class="txt"><div class="n">${esc(e.msg)}</div><div class="s">${timeAgo(e.t)}</div></div>`));
  });
  b.appendChild(log);
}
function timeAgo(ts){
  const d = Math.floor((Date.now()-ts)/1000);
  if(d<60)return 'только что';
  if(d<3600)return Math.floor(d/60)+' мин назад';
  return Math.floor(d/3600)+' ч назад';
}

function renderWarehouse(body){
  const b = body || $('appBody');
  b.innerHTML = '';

  const totalQty = getStockCount();

  for(const id in S.stock) totalVal += S.stock[id].qty * PROD_BY_ID[id].baseCost;

  const head = el('div','card tight');

  `;
  b.appendChild(head);

  // Сортировка
  const sortWrap = el('div','chips');
  [['qty','По кол-ву'],['profit','По прибыли'],['exp','По сроку']].forEach(([k,label])=>{

    c.onclick = ()=>{ warehouseSort = k; renderWarehouse(); };
    sortWrap.appendChild(c);
  });
  b.appendChild(sortWrap);

  // Просрочка
  const expired = Object.keys(S.stock).filter(id=>S.stock[id].expires && S.stock[id].expires<Date.now());
  if(expired.length){
    const warn = el('div','card');
    warn.style.borderColor = 'var(--red)';
    warn.innerHTML = `<div class="card-title red">⌛ Просрочка (${expired.length})</div>`;
    expired.forEach(id=>{
      warn.appendChild(el('div','item',
        `<div class="ico">${PROD_BY_ID[id].emoji}</div><div class="txt"><div class="n">${esc(PROD_BY_ID[id].name)}</div><div class="s red">Просрочено — списать</div></div><div class="val">${S.stock[id].qty} шт</div>`
      ));
    });
    const wbtn = el('button','btn red full sm','🗑 Списать всю просрочку');
    wbtn.style.marginTop = '8px';
    wbtn.onclick = ()=>{ expireStock(); renderWarehouse(); };
    warn.appendChild(wbtn);
    b.appendChild(warn);
  }

  if(getStockCount()===0){
    b.appendChild(el('div','empty',`<span class="e">📦</span>Склад пуст. Перейди в <b>Закупки</b>, чтобы заказать товар.`));
    return;
  }

  // Аккордеон по категориям
  Object.keys(CATS).forEach(catKey=>{
    const cat = CATS[catKey];
    const itemsInStock = Object.keys(S.stock).filter(id=>PROD_BY_ID[id].cat===catKey);
    if(itemsInStock.length===0) return;

    itemsInStock.sort((a,b)=>{
      if(warehouseSort==='qty') return S.stock[b].qty - S.stock[a].qty;
      if(warehouseSort==='profit'){
        const pa = (getPrice(a)-S.stock[a].cost)*S.stock[a].qty;
        const pb = (getPrice(b)-S.stock[b].cost)*S.stock[b].qty;
        return pb - pa;
      }
      const ea = S.stock[a].expires||9e15;
      const eb = S.stock[b].expires||9e15;
      return ea - eb;
    });

    const acc = el('div');
    const totalInCat = itemsInStock.reduce((a,id)=>a+S.stock[id].qty,0);
    const headEl = el('div','acc-head');
    headEl.innerHTML = `<span class="e">${cat.emoji}</span><span class="t">${cat.name}</span><span class="c">${totalInCat} шт</span><span class="ar">›</span>`;
    const bodyEl = el('div','acc-body');
    headEl.onclick = ()=>{
      headEl.classList.toggle('open');
      bodyEl.classList.toggle('open');
    };
    acc.appendChild(headEl);

    itemsInStock.forEach(id=>{
      const p = PROD_BY_ID[id];
      const st = S.stock[id];
      const price = getPrice(id);
      const margin = price - st.cost;
      const expiresIn = st.expires ? Math.max(0, (st.expires-Date.now())/3600000) : null;
      let expTxt = '', expClass = '';
      if(expiresIn!=null){
        if(expiresIn<6){ expTxt = '⌛ '+Math.floor(expiresIn)+'ч'; expClass='red'; }
        else if(expiresIn<24){ expTxt = '⏳ '+Math.floor(expiresIn)+'ч'; expClass='yellow'; }
        else expTxt = '✔ '+Math.floor(expiresIn/24)+'д';
      }
      const row = el('div','item');
      row.innerHTML = `
        <div class="ico">${p.emoji}</div>
        <div class="txt">
          <div class="n">${esc(p.name)}</div>
          <div class="s">Закуп: ${fmt(st.cost)} ₽ · Цена: ${fmt(price)} ₽ · Приб: <span class="${margin>0?'green':'red'}">${fmt(margin)} ₽</span></div>
          ${expTxt?`<div class="s ${expClass}">${expTxt}</div>`:''}
        </div>
        <div class="val">${st.qty} шт</div>
      `;
      bodyEl.appendChild(row);
    });
    acc.appendChild(bodyEl);
    b.appendChild(acc);
  });
}

];

let dealExpires = 0;

function refreshDeal(){
  const p = pick(PRODUCTS);
  dealOfDay = p.id;
  dealExpires = Date.now() + 300000;
}
function getSupplierCost(p, supId){
  const sup = SUPPLIERS.find(s=>s.id===supId) || SUPPLIERS[1];
  let c = p.baseCost * sup.mult;
  if(p.cat==='season') c *= 0.85;
  const exchange = 1 + Math.sin(Date.now()/3600000)*0.05;
  if(p.cat==='tech' || /Milka|Lindt|Moet|Hennessy|Jack/.test(p.name)) c *= exchange;
  const qty = buyCart[p.id]||0;
  if(qty>=50) c *= 0.85;
  else if(qty>=20) c *= 0.92;
  else if(qty>=10) c *= 0.96;
  if(dealOfDay===p.id && dealExpires>Date.now()) c *= 0.7;
  return Math.round(c);
}

  b.appendChild(supInfo);

  // Корзина
  let cartCount = 0, cartTotal = 0;
  Object.keys(buyCart).forEach(id=>{
    cartCount += buyCart[id];
    cartTotal += buyCart[id] * getSupplierCost(PROD_BY_ID[id], buySupplier);
  });
  if(cartCount>0){
    const cartCard = el('div','card');
    const enough = cartTotal > sup.minOrder;
    const canPay = S.money >= cartTotal;
    cartCard.innerHTML = `
      <div class="card-title">🛒 Корзина ${cartCount} шт</div>
      <div class="row">
        <div><div class="muted">Сумма</div><div class="mid">${fmtMoney(cartTotal)}</div></div>
        <div class="btn-row">
          <button class="btn ghost sm" id="clearCart">Очистить</button>
          <button class="btn green sm" id="orderBtn">Заказать</button>
        </div>
      </div>
      ${!enough?`<div class="tiny red" style="margin-top:6px">Мин. заказ: ${fmt(sup.minOrder)} ₽ (не хватает ${fmt(sup.minOrder-cartTotal)} ₽)</div>`:''}
      ${enough && !canPay?`<div class="tiny red" style="margin-top:6px">Не хватает денег: нужно ${fmtMoney(cartTotal)}, у вас ${fmtMoney(S.money)}</div>`:''}
    `;
    cartCard.querySelector('#clearCart').onclick = ()=>{ buyCart={}; renderBuy(); };
    const orderBtn = cartCard.querySelector('#orderBtn');
    orderBtn.onclick = ()=>{
      // Пересчитаем на момент клика
      let ct = 0;
      Object.keys(buyCart).forEach(id=>{ ct += buyCart[id]*getSupplierCost(PROD_BY_ID[id], buySupplier); });
      if(ct <= sup.minOrder){
        push('❌','Мин. заказ',`Нужно минимум ${fmtMoney(sup.minOrder)}, у вас ${fmtMoney(ct)}`);
        beep(220,0.15,'sawtooth',0.05);
        return;
      }
      if(S.money < ct){
        push('❌','Недостаточно денег',`Нужно ${fmtMoney(ct)}`);
        beep(220,0.15,'sawtooth',0.05);
        return;
      }
      const items = Object.keys(buyCart).map(id=>({ id, qty:buyCart[id], cost:getSupplierCost(PROD_BY_ID[id],buySupplier) }));
      S.money -= ct;
      S.stats.spent += ct;
      activeDeliveries.push({
        supplier: buySupplier,
        items,
        arrivesAt: Date.now() + sup.deliverySec*1000,
        cost: ct,
        defectChance: sup.defectChance
      });
      buyCart = {};
      push('🚚','Заказ оформлен',`${items.length} поз. на ${fmt(ct)} ₽`);
      beep(600,0.1,'sine',0.05);
      renderBuy();
    };
    b.appendChild(cartCard);
  }

  // Категории
  const catChips = el('div','chips');
  const allChip = el('div','chip'+(buyFilterCat==='all'?' on':''),'Все');
  allChip.onclick = ()=>{ buyFilterCat='all'; renderBuy(); };
  catChips.appendChild(allChip);
  Object.keys(CATS).forEach(k=>{
    const c = el('div','chip'+(buyFilterCat===k?' on':''), CATS[k].emoji+' '+CATS[k].name.split(' ')[0]);
    c.onclick = ()=>{ buyFilterCat=k; renderBuy(); };
    catChips.appendChild(c);
  });
  b.appendChild(catChips);

  // Список товаров
  const list = el('div','card');
  const items = PRODUCTS.filter(p=>buyFilterCat==='all'||p.cat===buyFilterCat);
  items.slice(0,80).forEach(p=>{
    const cost = getSupplierCost(p, buySupplier);
    const qtyInCart = buyCart[p.id]||0;
    const row = el('div','item');
    row.innerHTML = `
      <div class="ico">${p.emoji}</div>
      <div class="txt">
        <div class="n">${esc(p.name)}</div>
        <div class="s">Закуп ${fmt(cost)} ₽ · Продажа ~${fmt(p.basePrice)} ₽</div>
      </div>
      <div class="val">
        <div style="display:flex;gap:4px;align-items:center">
          <button class="btn xs ghost" data-minus="${p.id}">−</button>
          <span style="min-width:28px;text-align:center;font-weight:700">${qtyInCart}</span>
          <button class="btn xs" data-plus="${p.id}">+</button>
        </div>
      </div>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('[data-plus]').forEach(btn=>{
    btn.onclick = ()=>{ const id=btn.getAttribute('data-plus'); buyCart[id]=(buyCart[id]||0)+1; renderBuy(); };
  });
  list.querySelectorAll('[data-minus]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute('data-minus');
      buyCart[id] = Math.max(0, (buyCart[id]||0)-1);
      if(!buyCart[id]) delete buyCart[id];
      renderBuy();
    };
  });
  b.appendChild(list);
}

let priceFilterCat = 'all';

  allC.onclick = ()=>{ priceFilterCat='all'; renderPrices(); };
  catChips.appendChild(allC);
  Object.keys(CATS).forEach(k=>{
    const c = el('div','chip'+(priceFilterCat===k?' on':''), CATS[k].emoji);
    c.onclick = ()=>{ priceFilterCat=k; renderPrices(); };
    catChips.appendChild(c);
  });
  b.appendChild(catChips);

  const stockIds = Object.keys(S.stock).filter(id=>priceFilterCat==='all'||PROD_BY_ID[id].cat===priceFilterCat);
  if(stockIds.length===0){
    b.appendChild(el('div','empty',`<span class="e">🏷</span>Нет товара на складе. Закупи товар во вкладке «Закупки».`));
    return;
  }
  stockIds.forEach(id=>{
    const p = PROD_BY_ID[id];
    const cur = getPrice(id);
    const min = Math.round(p.baseCost*0.9);
    const max = Math.round(p.baseCost*5);
    const rec = p.basePrice;
    const card = el('div','card tight');

    const priceVsRec = ((cur/rec-1)*100).toFixed(0);
    const priceColor = cur<rec*0.9 ? 'var(--green)' : cur>rec*1.15 ? 'var(--red)' : 'var(--text)';

    card.innerHTML = `
      <div class="row">
        <div style="display:flex;gap:10px;align-items:center;flex:1;min-width:0">
          <div class="ico">${p.emoji}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:650;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div>
            <div class="s tiny">Закуп ${fmt(S.stock[id].cost)} ₽ · Реком. ${fmt(rec)} ₽</div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:16px;font-weight:800;color:${priceColor}">${fmt(cur)} ₽</div>
          <div class="tiny">${priceVsRec>0?'+':''}${priceVsRec}% от рынка</div>
        </div>
      </div>
      <input type="range" min="${min}" max="${max}" value="${cur}" data-price="${id}" style="margin-top:10px">
      <div class="row" style="margin-top:4px">
        <span class="tiny">${fmt(min)}</span>
        <span class="tiny muted">реком. ${fmt(rec)}</span>
        <span class="tiny">${fmt(max)}</span>
      </div>
    `;
    card.querySelector('[data-price]').oninput = e=>{
      const v = parseInt(e.target.value);
      S.prices[id] = v / p.basePrice;
      clearTimeout(priceRenderTimer);
      priceRenderTimer = setTimeout(()=>{ if(currentApp==='prices') renderPrices(); }, 500);
    };
    b.appendChild(card);
  });
}
function changeAllPrices(mult){
  Object.keys(S.stock).forEach(id=>{
    const cur = S.prices[id]||1;
    S.prices[id] = clamp(cur*mult, 0.5, 5);
  });
  renderPrices();
  push('🏷','Цены изменены','Все позиции ×'+mult);
}
function resetAllPrices(){
  S.prices = {};
  renderPrices();
  push('🏷','Наценки сброшены','Установлены рекомендованные цены');
}
function discountCat(cat, mult){
  Object.keys(S.stock).forEach(id=>{
    if(PROD_BY_ID[id].cat===cat){
      const cur = S.prices[id]||1;
      S.prices[id] = clamp(cur*mult, 0.5, 5);
    }
  });
  renderPrices();
  push('🎁','Скидка!','Категория со скидкой ×'+mult);
}

function makeStaff(type){
  const t = STAFF_TYPES.find(x=>x.id===type);
  const isMale = Math.random()<0.5;
  const name = isMale ? pick(STAFF_NAMES_M) : pick(STAFF_NAMES_F);
  return {
    id: 's'+Date.now()+Math.random().toString(36).slice(2,6),
    type, role: t.name, name, emoji: t.emoji,
    level: 1, skill: rint(2,6), morale: 70+rint(0,20),
    salary: t.salary, hiredAt: Date.now()
  };
}

  const b = body || $('appBody');

  const totalSalary = S.staff.reduce((a,s)=>a+s.salary,0);

      const type = btn.getAttribute('data-hire');

      if(S.money < cost){ push('❌','Недостаточно денег',`Нужно ${fmtMoney(cost)}`); return; }

      S.staff.push(st);

      renderStaff();
    };

  if(S.staff.length===0){

  }

    const t = STAFF_TYPES.find(x=>x.id===st.type);
    const trainCost = 5000 + st.level*3000;
    const bonusCost = 2000;
    const row = el('div','item');
    row.style.flexWrap = 'wrap';
    row.innerHTML = `
      <div class="ico" style="background:${t.color}22">${st.emoji}</div>
      <div class="txt">
        <div class="n">${esc(st.name)} <span class="pill">${st.role}</span></div>
        <div class="s">Ур. ${st.level} · Скилл ${st.skill} · Мораль <span class="${st.morale<30?'red':st.morale<60?'yellow':'green'}">${st.morale}%</span></div>
        <div class="bar" style="margin-top:5px"><i style="width:${st.morale}%;background:${st.morale<30?'var(--red)':st.morale<60?'var(--yellow)':'var(--green)'}"></i></div>
      </div>
      <div class="val" style="width:100%;margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn xs ghost" data-train="${st.id}" ${S.money<trainCost?'disabled':''}>🎓 Обуч. ${fmt(trainCost)}₽</button>
        <button class="btn xs yellow" data-bonus="${st.id}" ${S.money<bonusCost?'disabled':''}>💵 Премия ${fmt(bonusCost)}₽</button>
        <button class="btn xs red" data-fire="${st.id}">Уволить</button>
      </div>
    `;
    listCard.appendChild(row);
  });
  listCard.querySelectorAll('[data-train]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute('data-train');
      const st = S.staff.find(x=>x.id===id);
      const cost = 5000 + st.level*3000;
      if(S.money<cost)return;
      S.money -= cost;
      if(st.level<10) st.level++;
      st.skill = Math.min(10, st.skill+1);
      st.morale = clamp(st.morale+5,0,100);
      push('🎓','Обучение','Уровень '+st.level+' · Скилл '+st.skill);
      renderStaff();
    };
  });
  listCard.querySelectorAll('[data-bonus]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute('data-bonus');
      const st = S.staff.find(x=>x.id===id);
      if(S.money<2000)return;
      S.money -= 2000;
      st.morale = clamp(st.morale+30,0,100);
      push('💵','Премия выдана', st.name+' доволен');
      renderStaff();
    };
  });
  listCard.querySelectorAll('[data-fire]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute('data-fire');
      const st = S.staff.find(x=>x.id===id);
      if(!st)return;
      showModal({
        title:'Уволить сотрудника?',
        text:`${st.name} (${st.role}) покинет магазин.`,
        actions:[
          {label:'Отмена', cls:'ghost'},
          {label:'Уволить', cls:'red', onClick:()=>{
            S.staff = S.staff.filter(x=>x.id!==st.id);
            push('👋','Сотрудник уволен', st.name);
            renderStaff();
          }}
        ]
      });
    };
  });
  b.appendChild(listCard);
}

  return Math.round(d.price * (1 + S.branches*0.5));
}

function generateAITips(){
  const tips = [];
  let tooExp = 0, tooCheap = 0;
  for(const id in S.stock){
    const p = PROD_BY_ID[id];
    const cur = getPrice(id);
    if(cur > p.basePrice*1.15) tooExp++;
    if(cur < p.basePrice*0.9) tooCheap++;
  }
  if(tooExp>0) tips.push(`${tooExp} товаров дороже рынка на 15%+ — снизь цены, а то покупатели злятся.`);
  if(tooCheap>0) tips.push(`${tooCheap} товаров ниже рынка — подними цену, упускаешь прибыль.`);
  if(S.clean<50) tips.push('Магазин грязный. Найм уборщика поднимет репутацию.');
  if(!hasStaff('cashier') && S.queue.length>3) tips.push('Очередь растёт! Найми кассира или обслуживай быстрее.');
  if(S.rep<40) tips.push('Репутация низкая. Скидки и подарки поднимут её.');
  if(S.stats.fines>10000) tips.push('Много штрафов. Следи за сроками годности и чистотой.');
  if(S.hour>=17 && S.hour<21) tips.push('Сейчас пиковое время — не закрывай магазин!');
  if(!S.depts.bakery && S.money>150000) tips.push('Пекарня даст хорошую маржу. Подумай об открытии.');
  if(S.marketing.boostTime<Date.now()) tips.push('Реклама не запущена — поток покупателей падает.');
  if(tips.length===0) tips.push('Всё неплохо! Продавай дальше и расширяйся.');
  return tips.slice(0,4);
}

function drawHourlyChart(cv, data){
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const dpr = window.devicePixelRatio || 1;
  if(cv.dataset.scaled !== '1'){
    cv.width = W*dpr; cv.height = H*dpr;
    cv.style.width = '100%';
    cv.dataset.scaled = '1';
    ctx.scale(dpr,dpr);
  }
  ctx.clearRect(0,0,W,H);
  const max = Math.max(1, ...data);
  const bw = W/24;
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const text2 = getComputedStyle(document.documentElement).getPropertyValue('--text2').trim();
  ctx.fillStyle = accent;
  data.forEach((v,i)=>{
    const h = (v/max)*(H-25);
    ctx.fillRect(i*bw+2, H-20-h, bw-4, h);
  });
  ctx.fillStyle = text2;
  ctx.font = '9px sans-serif';
  [0,6,12,18,23].forEach(h=>{
    ctx.fillText(h+':00', h*bw, H-6);
  });
}
function drawProfitChart(cv, data){
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const dpr = window.devicePixelRatio || 1;
  if(cv.dataset.scaled !== '1'){
    cv.width = W*dpr; cv.height = H*dpr;
    cv.style.width = '100%';
    cv.dataset.scaled = '1';
    ctx.scale(dpr,dpr);
  }
  ctx.clearRect(0,0,W,H);
  if(!data || data.length<2){
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text3').trim();
    ctx.font = '11px sans-serif';
    ctx.fillText('Мало данных — играйте больше', 60, H/2);
    return;
  }
  const max = Math.max(1, ...data.map(d=>Math.max(d.profit, d.spent)));
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const red = getComputedStyle(document.documentElement).getPropertyValue('--red').trim();
  const step = (W-20)/(data.length-1);
  ctx.beginPath();
  ctx.strokeStyle = accent; ctx.lineWidth = 2;
  data.forEach((d,i)=>{
    const x = 10+i*step;
    const y = H-15 - (d.profit/max)*(H-30);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.beginPath();
  ctx.strokeStyle = red; ctx.lineWidth = 2;
  data.forEach((d,i)=>{
    const x = 10+i*step;
    const y = H-15 - (d.spent/max)*(H-30);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.font = '10px sans-serif';
  ctx.fillStyle = accent; ctx.fillText('● Доход', 10, 12);
  ctx.fillStyle = red; ctx.fillText('● Расход', 70, 12);
}
function drawTopChart(cv, topGoods){
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const dpr = window.devicePixelRatio || 1;
  if(cv.dataset.scaled !== '1'){
    cv.width = W*dpr; cv.height = H*dpr;
    cv.style.width = '100%';
    cv.dataset.scaled = '1';
    ctx.scale(dpr,dpr);
  }
  ctx.clearRect(0,0,W,H);
  const arr = Object.keys(topGoods).map(id=>({id, n:topGoods[id]})).sort((a,b)=>b.n-a.n).slice(0,10);
  if(arr.length===0){
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text3').trim();
    ctx.font = '11px sans-serif';
    ctx.fillText('Пока нет продаж', 100, H/2);
    return;
  }
  const max = arr[0].n;
  const text = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const rowH = (H-10)/arr.length;
  arr.forEach((it,i)=>{
    const p = PROD_BY_ID[it.id];
    const w = (it.n/max)*(W-100);
    ctx.fillStyle = accent;
    ctx.fillRect(70, 5+i*rowH+2, w, rowH-4);
    ctx.fillStyle = text;
    ctx.font = '10px sans-serif';
    ctx.fillText(p.emoji+' '+p.name.slice(0,10), 3, 5+i*rowH+rowH/2+3);
    ctx.fillText(it.n+' шт', 70+w+3, 5+i*rowH+rowH/2+3);
  });
}

function doPrestige(){
  S.prestige++;
  S.prestigeMult = 1 + S.prestige*0.5;
  const keepAch = S.ach;
  const keepCreatedAt = S.createdAt;
  const keepStats = { earned:S.stats.earned, sold:S.stats.sold, thieves:S.stats.thieves };
  const newS = defaultState();
  newS.prestige = S.prestige;
  newS.prestigeMult = S.prestigeMult;
  newS.ach = keepAch;
  newS.nick = S.nick;
  newS.shopName = S.shopName;
  newS.avatar = S.avatar;
  newS.theme = S.theme;
  newS.sound = S.sound;
  newS.createdAt = keepCreatedAt;
  newS.stats.earned = keepStats.earned;
  newS.stats.sold = keepStats.sold;
  newS.stats.thieves = keepStats.thieves;
  S = newS;
  activeDeliveries = [];
  generateMissions();
  save();
  closeApp();
  push('♻️','Престиж пройден!',`Уровень ${S.prestige} · множитель ×${S.prestigeMult.toFixed(2)}`);
  renderDesktop();
}

function setupUI(){
  $('backBtn').onclick = ()=>closeApp();
  $('homeBar').onclick = ()=>{ if(currentApp) closeApp(); };

  // Свайп влево для закрытия
  let touchStartX = 0, touchStartY = 0;
  const win = $('appWin');
  win.addEventListener('touchstart', e=>{
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});
  win.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
    if(dx > 90 && dy < 60) closeApp();
  }, {passive:true});

  // Esc
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){
      if($('modalWrap').classList.contains('open')) closeModal();
      else if(currentApp) closeApp();
    }
  });
}

function init(){
  const loaded = load();
  S = loaded || defaultState();
  document.documentElement.setAttribute('data-theme', S.theme);
  if(!S.missions || Object.keys(S.missions).length===0) generateMissions();
  renderDesktop();
  setupUI();
  renderStatusBar();

  if(GAME_TICK) clearInterval(GAME_TICK);
  GAME_TICK = setInterval(()=>{
    tick();
    processDeliveries();
  }, 1000);

  // Приветствие
  setTimeout(()=>{
    if(!S.tutorial_done){
      push('👋','Добро пожаловать!','Симулятор магазина 24/7. Открывай приложения и продавай!');
      S.tutorial_done = true;
      save();
    } else {
      push('🚀','С возвращением!',`День ${S.day}, ${S.shopName}`);
    }
  }, 700);

  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) save(); });

  // Обработка ресайза для canvas (если открыта аналитика)
  window.addEventListener('resize', ()=>{
    if(currentApp==='analytics') renderAnalytics();
  });
}

/* ---------- 5. Спецзаказы ---------- */
function refreshSpecialLot(){
  const pool = PRODUCTS.filter(p => p.baseCost >= 300);
  const items = [];
  const used = new Set();
  let attempts = 0;
  while(items.length < 3 && attempts < 80){
    attempts++;
    const p = pick(pool);
    if(used.has(p.id)) continue;
    used.add(p.id);
    items.push({ id: p.id, qty: rint(1,5), discount: 0.30 + Math.random()*0.20 });
  }
  S.specialLot = { items, expiresAt: Date.now() + 300000 };
}

/* ---------- 6. Множитель потока + лояльность + лояльный бонус ---------- */
const _origCFM5 = customerFlowMult;
customerFlowMult = function(){
  let m = _origCFM5();
  if(S.upgrades.loyalty) m *= 1.20;
  return clamp(m, 0.1, 10);
};

const _origServeCust5 = serveCustomer;
serveCustomer = function(cust){
  const r = _origServeCust5(cust);
  if(S.upgrades.loyalty && r && r.ok && r.total > 0){
    const bonus = Math.floor(r.total * 0.05);
    S.money += bonus;
    S.stats.earned += bonus;
    S.stats.todayEarned += bonus;
    r.total += bonus;
  }
  return r;
};

/* ---------- 7. Патч tick: пассивный доход от онлайн-магазина и курьеров ---------- */
const _origTick5 = tick;
tick = function(){
  _origTick5();

  // Обновление спецлота
  if(!S.specialLot || S.specialLot.expiresAt < Date.now()) refreshSpecialLot();

  // Онлайн-магазин: пассивный доход
  if(S.upgrades.online){
    const inc = Math.floor(S.rep * S.level * 5 * S.prestigeMult);
    if(inc > 0){
      S.money += inc;
      S.stats.earned += inc;
      S.stats.todayEarned += inc;
    }
  }

  // Курьеры: дополнительный доход при активном онлайне
  const couriers = S.staff.filter(s => s.type === 'courier');
  if(couriers.length && S.upgrades.online){
    const perCourier = Math.floor(S.rep * S.level * 2 * S.prestigeMult);
    const inc = couriers.length * perCourier;
    if(inc > 0){
      S.money += inc;
      S.stats.earned += inc;
      S.stats.todayEarned += inc;
    }
  }
};

function buildSpecialCard(){
  if(!S.specialLot || S.specialLot.expiresAt < Date.now()) refreshSpecialLot();
  if(!S.specialLot || !S.specialLot.items.length) return null;

  const card = el('div','card');
  card.style.borderColor = 'var(--purple)';
  const secs = Math.max(0, Math.ceil((S.specialLot.expiresAt - Date.now())/1000));
  card.innerHTML = `<div class="card-title purple">🎁 Спецзаказы · ${secs}с</div>`;

  S.specialLot.items.forEach(item => {
    const p = PROD_BY_ID[item.id];
    if(!p) return;
    const cost = Math.round(p.baseCost * (1 - item.discount));
    const total = cost * item.qty;
    const row = el('div','item');
    row.innerHTML = `

      <div class="txt">

      </div>
    `;
    card.appendChild(row);
  });

  card.querySelectorAll('[data-special]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-special');
      const item = S.specialLot.items.find(x => x.id === id);
      if(!item) return;
      const cost = Math.round(PROD_BY_ID[id].baseCost * (1 - item.discount));

        push('❌','Мало денег',`Нужно ${fmtMoney(total)}`);

      S.specialLot.items = S.specialLot.items.filter(x => x.id !== id);
      push('🎁','Спецзаказ куплен', `${item.qty}× ${PROD_BY_ID[id].name}`);

function getTodayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getTodayHoliday(){
  const d = new Date();
  return HOLIDAYS.find(h => h.m === (d.getMonth()+1) && h.d === d.getDate());
}
function getUpcomingHolidays(limit){
  const today = new Date();
  const list = [];
  for(let offset=0; offset<400 && list.length<limit; offset++){
    const d = new Date(today);
    d.setDate(d.getDate()+offset);
    const h = HOLIDAYS.find(x => x.m === (d.getMonth()+1) && x.d === d.getDate());
    if(h && offset > 0) list.push({ ...h, date:d, daysAway: offset });
  }
  return list;
}

/* ---------- 4. ЕЖЕДНЕВНЫЙ STREAK ---------- */
const DAILY_REWARDS = [
  { day:1, money:5000,    label:'5K ₽' },
  { day:2, money:10000,   label:'10K ₽' },
  { day:3, money:20000,   label:'20K ₽' },
  { day:4, money:40000,   label:'40K ₽' },
  { day:5, money:80000,   label:'80K ₽' },
  { day:6, money:150000,  label:'150K ₽' },
  { day:7, money:500000,  label:'500K ₽ + бонус' }
];

function canClaimDaily(){
  const today = getTodayKey();
  return S.lastDailyDate !== today;
}
function consecutiveStreak(){
  const today = getTodayKey();
  if(S.lastDailyDate === today) return S.streak;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yKey = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  if(S.lastDailyDate === yKey) return S.streak;
  return 0;
}
function claimDaily(){
  if(!canClaimDaily()) return;
  const cur = consecutiveStreak();
  const next = (cur >= 7) ? 1 : (cur + 1);
  S.streak = next;
  S.lastDailyDate = getTodayKey();
  const reward = DAILY_REWARDS.find(r => r.day === next);
  S.money += reward.money;
  S.stats.earned += reward.money;
  if(next === 7){
    // бонусная плюшка
    const bonusItems = ['dairy_0','sweet_0','drink_0','alcohol_0'];
    const id = pick(bonusItems);
    addStock(id, 20, 0);
    addRep(3);
    push('🎉','7-дневная серия!', `+500K ₽ · +20× ${PROD_BY_ID[id].name} · +3 реп`);
  } else {
    push('🎁','Ежедневная награда', `День ${next} серии: ${reward.label}`);
  }
  beep(880,0.15,'sine',0.07);
  save();
}

function rollCase(caseDef){
  const total = caseDef.pool.reduce((a, p) => a + p.w, 0);
  let r = Math.random()*total;
  for(const p of caseDef.pool){
    r -= p.w;
    if(r <= 0) return p;
  }
  return caseDef.pool[0];
}

function applyCaseReward(reward){
  const lines = [];
  if(reward.kind === 'money'){
    const m = rint(reward.min, reward.max);
    S.money += m; S.stats.earned += m;
    lines.push({ emoji:'💰', text:'+'+fmtMoney(m), color:'var(--green)' });
  } else if(reward.kind === 'stock'){
    const avail = PRODUCTS.filter(p => p.cat === reward.itemCat);
    const p = pick(avail);
    const q = rint(reward.min, reward.max);
    addStock(p.id, q, 0);
    lines.push({ emoji:p.emoji, text:'+'+q+'× '+p.name, color:'var(--accent)' });
  } else if(reward.kind === 'rep'){
    const r = rint(reward.min, reward.max);
    addRep(r);
    lines.push({ emoji:'⭐', text:'+'+r+' репутации', color:'var(--yellow)' });
  } else if(reward.kind === 'boost'){
    S.marketing.boostMult = Math.max(S.marketing.boostMult, reward.mult);
    S.marketing.boostTime = Date.now() + reward.dur*1000;
    lines.push({ emoji:'📣', text:'Буст ×'+reward.mult+' на '+reward.dur+'с', color:'var(--purple)' });
  } else if(reward.kind === 'skin'){
    S._boughtSkins = S._boughtSkins || [];
    if(!S._boughtSkins.includes(reward.skinId)){
      S._boughtSkins.push(reward.skinId);
      const sk = SKINS.find(s => s.id === reward.skinId);
      lines.push({ emoji:'🎨', text:'Эксклюзивный скин: '+(sk?sk.name:reward.skinId), color:'var(--pink)' });
    } else {
      const m = 500000;
      S.money += m; S.stats.earned += m;
      lines.push({ emoji:'💰', text:'Дубль скина → +'+fmtMoney(m), color:'var(--green)' });
    }
  }
  return lines;
}

function openCase(caseId){
  const c = CASES.find(x => x.id === caseId);
  if(!c) return;
  if(S.money < c.price){
    push('❌','Мало денег', `Нужно ${fmtMoney(c.price)}`);
    beep(220,0.15,'sawtooth',0.05);
    return;
  }
  S.money -= c.price;
  S.stats.spent += c.price;
  S.casesOpened = (S.casesOpened || 0) + 1;

  // Модалка с рулеткой
  const wrap = el('div');
  wrap.style.textAlign = 'center';
  const drum = el('div');
  drum.style.cssText = 'font-size:52px;padding:20px 0;letter-spacing:6px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.2))';
  drum.textContent = '🎁 🎁 🎁';
  wrap.appendChild(drum);
  const status = el('div','muted','Крутим...');
  status.style.marginTop = '8px';
  wrap.appendChild(status);

  showModal({
    title: c.emoji + ' ' + c.name + ' кейс',
    body: wrap,
    actions: []
  });

  const filler = ['🎁','💎','🎰','⭐','💰','🎨','📣','🍀','💵','🎉'];
  let ticks = 0;
  const maxTicks = 22;
  const spin = setInterval(() => {
    ticks++;
    const seq = [];
    for(let i=0;i<3;i++) seq.push(pick(filler));
    drum.textContent = seq.join(' ');
    if(ticks >= maxTicks){
      clearInterval(spin);
      const reward = rollCase(c);
      const lines = applyCaseReward(reward);
      // Показать результат
      wrap.innerHTML = '';
      const big = el('div');
      big.style.cssText = 'font-size:60px;padding:16px 0;animation:pushIn .5s cubic-bezier(.2,.9,.3,1.15)';
      big.textContent = lines[0]?.emoji || '🎁';
      wrap.appendChild(big);
      lines.forEach(l => {
        const t = el('div');
        t.style.cssText = `font-size:16px;font-weight:750;color:${l.color};margin:6px 0`;
        t.textContent = l.text;
        wrap.appendChild(t);
      });
      // Кнопка закрытия
      const closeBtn = el('button','btn full','Отлично!');
      closeBtn.style.marginTop = '14px';
      closeBtn.onclick = () => {
        closeModal();
        renderBonus();
        save();
      };
      wrap.appendChild(closeBtn);
      // Пуш + звук
      push('🎉','Кейс открыт!', lines.map(l => l.text).join(' · '));
      beep(880,0.18,'sine',0.07);
      setTimeout(() => beep(1046,0.15,'sine',0.06), 100);
    }
  }, 80);
}

/* ---------- 8. Доходы: недвижимость + холдинги + мегапроекты ---------- */
function calculateEmpireIncome(){
  let inc = 0;
  // Недвижимость
  PROPERTIES.forEach(p => {
    const n = S.empire.properties[p.id] || 0;
    inc += n * p.income;
  });
  // Холдинги — 0.1% от капитала компании в минуту
  if(S.empire.holdings.length){
    S.empire.holdings.forEach(name => {
      const c = LEADERBOARD.find(x => x.name === name);
      if(c) inc += Math.floor(c.cap * 0.00001); // 0.001% в минуту
    });
  }
  return inc;
}

  _origTick7();

  // Империя: пассивный доход
  const empireInc = calculateEmpireIncome();
  if(empireInc > 0){
    S.money += empireInc;
    S.stats.earned += empireInc;
    S.stats.todayEarned += empireInc;
  }

  // Движение акций (раз в 15 секунд)
  if(tickCounter % 15 === 0 && STOCK_PRICES){
    STOCKS.forEach(s => {
      const cur = STOCK_PRICES[s.sym];
      const drift = (Math.random() - 0.5) * s.vol * 2;
      let next = cur * (1 + drift);
      // Ограничения: не ниже 30% от базы, не выше 500%
      next = clamp(next, s.base*0.3, s.base*5);
      STOCK_PRICES[s.sym] = Math.round(next * 100) / 100;
    });
    persistStockPrices();
  }

  // VIP обновление
  if(tickCounter % 30 === 0) updateVip();

  // Автозакрытие при уходе с экрана акций
  if(currentApp === 'empire' && tickCounter % 3 === 0){
    // мягкое обновление цифр дохода и цен акций
    const incEl = document.getElementById('empireIncome');
    if(incEl) incEl.textContent = '+'+fmt(empireInc)+'/мин';

  let m = _origCFM7();
  // Мегапроекты
  S.empire.mega.forEach(id => {
    const proj = MEGA.find(x => x.id === id);
    if(proj) m *= proj.flow;
  });

  const vip = vipTier();
  if(vip.lvl >= 1) m *= (1 + 0.10*vip.lvl);
  return clamp(m, 0.1, 15);
};

const _origServeCust7 = serveCustomer;
serveCustomer = function(cust){
  const r = _origServeCust7(cust);
  if(r && r.ok && r.total > 0){
    const vip = vipTier();
    const bonusPct = [0,0.05,0.10,0.15,0.25][vip.lvl] || 0;
    if(bonusPct > 0){
      const extra = Math.floor(r.total * bonusPct);
      S.money += extra;
      S.stats.earned += extra;
      S.stats.todayEarned += extra;
      r.total += extra;
    }
  }
  return r;
};

  const owned = S.empire.properties[id] || 0;
  if(owned >= p.max){
    push('❌','Максимум', 'Достигнут лимит по этому объекту');
    return;
  }
  const price = Math.round(p.price * Math.pow(1.15, owned));
  if(S.money < price){
    push('❌','Мало денег', `Нужно ${fmtMoney(price)}`);
    beep(220,0.15,'sawtooth',0.05);
    return;
  }
  S.money -= price;
  S.empire.properties[id] = owned + 1;
  push(p.emoji,'Куплено!', p.name + ' (' + (owned+1) + '/' + p.max + ')');
  beep(880,0.15,'sine',0.07);
  save();
  renderEmpire();
}
